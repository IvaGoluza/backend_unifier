<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oporavak Lozinke</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }

        .container {
            margin: 50px auto;
            padding: 20px;
            max-width: 700px;
            text-align: center; /* Dodan stil za lijevo poravnanje unutar containera */
        }

        h2 {
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1E1E1E;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px auto; /* Dodan stil za centriranje gumba */
        }

        .message {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 20px; /* Dodan margin-bottom za razmak ispod poruke */
            text-align: center; /* Dodan stil za centriranje poruke */
        }

        .message-left {
            text-align: left;
        }

        a:link {
            text-decoration: none;
        }

        a:visited {
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }

        a:active {
            text-decoration: none;
        }

        .button:hover {
            text-decoration: underline;
        }

        img.signature {
            float: left;
            margin-right: 10px;
        }

        .button-container {
            width: 100%;
            display: flex;
            align-content: center;
            justify-content: center;
        }

        .img-container {
            width: 100%;
            display: flex;
            align-content: flex-start;
            justify-content: start;
        }

        @media (prefers-color-scheme: dark) {
            .button {
                background-color: #1E1E1E;
                color: white;
                cursor: pointer;
            }

        }
    </style>

</head>
<body>
<div class="container">
    <h2>Oporavak Lozinke</h2>
    <p class="message-left">Ako ste zaboravili lozinku, kliknite na gumb ispod kako biste započeli proces oporavka
        lozinke.</p>
    <div class="button-container">
        <a class="button" href="{url}">Oporavi Lozinku</a>
    </div>
    <p class="message-left">Ako gumb iznad ne radi, kopirajte i zalijepite sljedeći link u Vaš preglednik:<br>{url}</p>
    <p class="message">Ako niste tražili resetiranje lozinke, slobodno zanemarite ovaj email.</p>
    <div class="img-container">
        <img alt="" src="cid:signature"/>
    </div>
</div>
</body>
</html>
